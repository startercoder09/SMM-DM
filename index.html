<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOT SMM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#f2f6fb;--mute:#9fb0c4;--glass:rgba(12,20,36,.66);--line:rgba(255,255,255,.1);--acc:#38bdf8;--acc2:#7c5cff;--gold:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:14px 16px calc(110px + env(safe-area-inset-bottom,0px));min-height:100vh;background:#0a1120}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#0a1120,#13264a,#2a1b5e,#0a1120);background-size:300% 300%;animation:drift 24s ease infinite}
.bg video{width:100%;height:100%;object-fit:cover}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,28,.55),rgba(8,14,28,.82))}
@keyframes drift{50%{background-position:100% 100%}}
@media (prefers-reduced-motion:reduce){.bg{animation:none}}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;font-size:16px}
h1{font-size:28px;line-height:1.15;margin:22px 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.g{background:var(--glass);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{font:inherit;color:inherit;text-align:left;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.cat b{font-size:18px}.cat small{color:var(--mute)}.cat.on{border-color:rgba(56,189,248,.55)}.cat.off{opacity:.55}
.list{overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left}
.row:last-child{border:0}.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.row .ic{font-size:22px;width:34px;flex:none}.row .t{flex:1}.row .p{font-weight:700;white-space:nowrap;text-align:right}.row .p small{font-weight:400}
.star{color:var(--gold)}
label{display:block;font-size:14px;color:var(--mute);margin:16px 0 6px}
input,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(8,14,28,.6);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px}
.sum{margin-top:18px;padding:14px 16px;display:flex;justify-content:space-between;font-size:18px}
.note{color:var(--mute);font-size:13px;margin-top:12px}.err{color:#ff8a80;font-size:13px;margin-top:6px;min-height:16px}
.btn{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font:700 17px -apple-system,Roboto,sans-serif}
.back{border:0;background:none;color:var(--acc);font:inherit;padding:14px 0 0}
</style>
</head>
<body>
<div class="bg" id="bg"><video autoplay muted loop playsinline preload="auto" onerror="this.remove()"><source src="bg.mp4" type="video/mp4"></video></div>
<div class="logo"><i>⚡</i>SOT SMM</div>
<div id="app"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.("#0a1120");tg?.setBackgroundColor?.("#0a1120");
let CAT=[],st={v:"home",sec:null,it:null,link:"",qty:"",note:""};
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString("ru-RU"),pr=p=>p%1?p.toFixed(2):p;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const total=()=>st.it&&+st.qty>0?Math.ceil(st.it.price*st.qty/10)/100:0;
const CATS=[["Telegram","Подписчики, просмотры, бусты",1],["Instagram","Скоро",0],["YouTube","Скоро",0],["TikTok","Скоро",0]];
const up={sections:"home",items:"sections",form:"items"};
function go(v){st.v=v;render();scrollTo(0,0)}
function render(){
 const a=$("#app");tg?.MainButton.hide();
 st.v==="home"?tg?.BackButton.hide():tg?.BackButton.show();
 if(st.v==="home"){
  a.innerHTML=`<h1>Продвижение в соцсетях</h1><p class="sub">Выберите площадку, создайте заказ и оплатите его прямо в боте.</p><div class="grid">${CATS.map((c,i)=>`<button class="g cat ${c[2]?"on":"off"}" data-i="${i}"><b>${c[0]}</b><small>${c[1]}</small></button>`).join("")}</div>`;
  a.querySelectorAll(".cat").forEach(b=>b.onclick=()=>CATS[b.dataset.i][2]?go("sections"):tg?.showAlert("Эта площадка скоро появится"));
 }else if(!CAT.length){a.innerHTML=`<h1>Каталог загружается…</h1><p class="sub">Если ничего не появилось, закройте и откройте приложение заново.</p>`}
 else if(st.v==="sections"){
  a.innerHTML=`<button class="back" data-b>‹ Площадки</button><h1>Telegram</h1><p class="sub">Выберите раздел</p><div class="g list">${CAT.map((s,i)=>`<button class="row" data-i="${i}"><span class="ic">${s.icon}</span><span class="t">${esc(s.title)}<small>${s.items.length} вариантов · от ${pr(Math.min(...s.items.map(x=>x.price)))} ₽ за 1000</small></span><span>›</span></button>`).join("")}</div>`;
  a.querySelectorAll(".row").forEach(b=>b.onclick=()=>{st.sec=CAT[b.dataset.i];go("items")});
 }else if(st.v==="items"){
  const s=st.sec;
  a.innerHTML=`<button class="back" data-b>‹ Разделы</button><h1>${esc(s.title)}</h1><p class="sub">${esc(s.note||"")}</p><div class="g list">${s.items.map((x,i)=>`<button class="row" data-i="${i}"><span class="t">${x.star?'<span class="star">★</span> ':""}${esc(x.name)}</span><span class="p">${pr(x.price)} ₽<small> /1000</small></span></button>`).join("")}</div>`;
  a.querySelectorAll(".row").forEach(b=>b.onclick=()=>{st.it=s.items[b.dataset.i];st.qty="";st.note="";go("form")});
 }else{
  const s=st.it,q=[s.min,s.min*5,s.min*10,s.min*50].filter(x=>x<=s.max);
  a.innerHTML=`<button class="back" data-b>‹ Назад</button><h1>${esc(st.sec.title)}</h1><p class="sub">${esc(s.name)}</p>
  <label for="l">Ссылка на канал или пост</label><input id="l" placeholder="https://t.me/…" value="${esc(st.link)}" autocapitalize="off">
  <label for="q">Количество (${fmt(s.min)} – ${fmt(s.max)})</label><input id="q" type="number" inputmode="numeric" value="${st.qty}"><div class="chips">${q.map(x=>`<button class="chip" data-q="${x}">${fmt(x)}</button>`).join("")}</div>
  <label for="n">${esc(s.ask||"Пожелания (необязательно)")}</label><textarea id="n" rows="2">${esc(st.note)}</textarea>
  <div class="err" id="e"></div><div class="g sum"><span>К оплате</span><b id="p"></b></div>
  <p class="note">После создания заказа вы сможете оплатить его в чате или задать вопросы менеджеру. Когда раскрутка начнётся, отменить её уже нельзя.</p>
  <button class="btn" id="go">Создать заказ</button>`;
  const upd=()=>$("#p").textContent=fmt(total())+" ₽";upd();
  $("#l").oninput=e=>st.link=e.target.value.trim();
  $("#q").oninput=e=>{st.qty=e.target.value;upd()};$("#n").oninput=e=>st.note=e.target.value;
  a.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{st.qty=c.dataset.q;$("#q").value=st.qty;upd()});
  $("#go").onclick=submit;
 }
 a.querySelectorAll("[data-b]").forEach(b=>b.onclick=back);
}
function back(){if(up[st.v])go(up[st.v])}
function submit(){
 const s=st.it,n=+st.qty,e=$("#e");
 if(!/^(https?:\/\/)?(t\.me|telegram\.me)\/|^@\w{4,}/i.test(st.link)){e.textContent="Укажите ссылку вида https://t.me/… или @username";return}
 if(!(n>=s.min&&n<=s.max)){e.textContent=`Количество — от ${fmt(s.min)} до ${fmt(s.max)}`;return}
 const d={id:s.id,link:st.link,qty:n,note:st.note};
 tg?tg.sendData(JSON.stringify(d)):alert(JSON.stringify(d,null,1));
}
tg?.BackButton.onClick(back);
fetch("catalog.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{CAT=j.sections;render()}).catch(()=>{});
render();
</script>
</body>
</html>
